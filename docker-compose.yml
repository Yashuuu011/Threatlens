services:
  postgres:
    image: postgres:16-alpine
    container_name: threatlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatlens_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-threatlens_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - threatlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threatlens} -d ${POSTGRES_DB:-threatlens_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: threatlens-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ThreatLens
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-threatlens}:${POSTGRES_PASSWORD:-threatlens_secure_pwd}@postgres:5432/${POSTGRES_DB:-threatlens_db}
      ALLOW_SQLITE_FALLBACK: "false"
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-ThreatLens!Admin2026}
      INITIAL_ANALYST_USERNAME: ${INITIAL_ANALYST_USERNAME:-analyst}
      INITIAL_ANALYST_PASSWORD: ${INITIAL_ANALYST_PASSWORD:-ThreatLens!Analyst2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-20}
      RATE_LIMIT_INGEST_PER_MINUTE: ${RATE_LIMIT_INGEST_PER_MINUTE:-600}
      RATE_LIMIT_INTEL_PER_MINUTE: ${RATE_LIMIT_INTEL_PER_MINUTE:-60}
      RATE_LIMIT_EXPORT_PER_MINUTE: ${RATE_LIMIT_EXPORT_PER_MINUTE:-30}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-300}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: threatlens-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  threatlens_pgdata:

